name: ASH08 reviewed baseline CI

on:
  pull_request:
  push:
    branches: [main, "ship/**"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reject placeholder regressions
        run: |
          python - <<'PY'
          from pathlib import Path
          critical = [Path('api.py'), Path('desk/ASH08_Desk_Dashboard.html')]
          for path in critical:
              text = path.read_text(encoding='utf-8').strip()
              assert text != 'PLACEHOLDER', f'{path} is a literal placeholder'
              assert len(text.splitlines()) >= 20, f'{path} is unexpectedly short'
          PY
      - name: Compile
        run: python -m py_compile api.py ash08/*.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Configuration assertions
        run: |
          python - <<'PY'
          from ash08.config import BOOK_VALUE, SCORE_SELECT, SCORE_WATCH
          assert BOOK_VALUE == 5_000_000
          assert SCORE_SELECT == 67
          assert SCORE_WATCH == 60
          PY
