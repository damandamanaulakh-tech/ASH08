name: ASH08 G0 contract CI

on:
  pull_request:
  push:
    branches: [main, "ship/**"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reject placeholder regressions
        run: |
          python - <<'PY'
          from pathlib import Path
          critical = [Path('api.py'), Path('desk/ASH08_Desk_Dashboard.html')]
          for path in critical:
              text = path.read_text(encoding='utf-8').strip()
              assert text != 'PLACEHOLDER', f'{path} is a literal placeholder'
              assert len(text.splitlines()) >= 20, f'{path} is unexpectedly short'
          PY
      - name: Compile
        run: python -m py_compile api.py ash08/*.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: G0 configuration assertions
        run: |
          python - <<'PY'
          from ash08.config import BOOK_VALUE, SCORE_SELECT, SCORE_WATCH, SCORE_NEAR_MISS, CORR_MAX, CORE_MIN, CORE_MAX, MAX_OPEN_POSITIONS, CASH_RESERVE_PCT, KELLY_FRACTION, KELLY_MAX_PCT
          assert BOOK_VALUE == 50_000_000
          assert SCORE_SELECT == 68
          assert SCORE_NEAR_MISS == 68
          assert SCORE_WATCH == 55
          assert CORR_MAX == 0.70
          assert CORE_MIN == 150 and CORE_MAX == 250
          assert MAX_OPEN_POSITIONS == 500
          assert CASH_RESERVE_PCT == 5
          assert KELLY_FRACTION == 0.5
          assert KELLY_MAX_PCT == 0.05
          PY
      - name: Reject 67/60 resurrection on main
        run: |
          python - <<'PY'
          from pathlib import Path
          from ash08.scanner import SCORE_SELECT, SCORE_WATCH, CORR_MAX
          assert SCORE_SELECT == 68.0
          assert SCORE_WATCH == 55.0
          assert CORR_MAX == 0.70
          html = Path('desk/ASH08_Desk_Dashboard.html').read_text(encoding='utf-8')
          assert '≤ 0.70' in html or '<= 0.70' in html
          assert 'score >= 67' not in Path('README.md').read_text(encoding='utf-8')
          api = Path('api.py').read_text(encoding='utf-8')
          assert '0.14 - (i' not in api
          assert '78 - (i % 11)' not in api
          PY
