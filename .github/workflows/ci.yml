name: ASH08 G0 contract CI

on:
  pull_request:
  push:
    branches: [main, "ship/**"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reject placeholder regressions
        run: |
          python - <<'PY'
          from pathlib import Path
          critical = [Path('api.py'), Path('desk/ASH08_Desk_Dashboard.html')]
          for path in critical:
              text = path.read_text(encoding='utf-8').strip()
              assert text != 'PLACEHOLDER', f'{path} is a literal placeholder'
              assert len(text.splitlines()) >= 20, f'{path} is unexpectedly short'
          PY
      - name: Compile
        run: python -m py_compile api.py ash08/*.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: G0 configuration assertions
        run: |
          python - <<'PY'
          from ash08.config import BOOK_VALUE, SCORE_SELECT, SCORE_WATCH, CORR_MAX
          assert BOOK_VALUE == 5_000_000
          assert SCORE_SELECT == 70
          assert SCORE_WATCH == 55
          assert CORR_MAX == 0.70
          PY
      - name: Reject 67/60 resurrection on main
        run: |
          python - <<'PY'
          from pathlib import Path
          from ash08.scanner import SCORE_SELECT, SCORE_WATCH, CORR_MAX
          assert SCORE_SELECT == 70.0
          assert SCORE_WATCH == 55.0
          assert CORR_MAX == 0.70
          html = Path('desk/ASH08_Desk_Dashboard.html').read_text(encoding='utf-8')
          assert '≤ 0.70' in html or '<= 0.70' in html
          assert 'score >= 67' not in Path('README.md').read_text(encoding='utf-8')
          PY
