name: Restore approved TCS paper position

on:
  push:
    branches: ["ops/read-live-paper-book"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Restore at original entry and verify live book
        shell: bash
        run: |
          set -euo pipefail
          base="https://ash08-desk.onrender.com"
          cookie=/tmp/ash08.cookies

          curl -sS --fail-with-body --connect-timeout 20 --max-time 120 \
            -c "$cookie" -H "Origin: $base" \
            "$base/api/session" -o /tmp/session.json
          csrf=$(python - <<'PY'
          import json
          print(json.load(open('/tmp/session.json'))['csrf_token'])
          PY
          )

          echo "--- refresh validated NSE instruments ---"
          code=$(curl -sS --connect-timeout 20 --max-time 180 \
            -b "$cookie" \
            -H "Origin: $base" \
            -H "X-CSRF-Token: $csrf" \
            -H "Content-Type: application/json" \
            -X POST "$base/api/universe/refresh" \
            --data '{}' -o /tmp/universe.json -w '%{http_code}')
          echo "HTTP $code"
          python -m json.tool /tmp/universe.json
          test "$code" = "200"

          echo "--- restore TCS at original entry ---"
          code=$(curl -sS --connect-timeout 20 --max-time 120 \
            -b "$cookie" \
            -H "Origin: $base" \
            -H "X-CSRF-Token: $csrf" \
            -H "Content-Type: application/json" \
            -H "Idempotency-Key: restore:tcs:3840:50l-v1" \
            -X POST "$base/api/paper/buy" \
            --data '{"symbol":"TCS","qty":50,"price":3840,"hold_sessions":15}' \
            -o /tmp/order.json -w '%{http_code}')
          echo "HTTP $code"
          python -m json.tool /tmp/order.json
          test "$code" = "200"

          echo "--- verified paper book ---"
          curl -sS --fail-with-body --connect-timeout 20 --max-time 120 \
            "$base/api/paper/book" -o /tmp/book.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/book.json'))
          print(json.dumps(data, indent=2, sort_keys=True))
          opens=data.get('open') or []
          assert len(opens)==1, f"expected one open position, got {len(opens)}"
          p=opens[0]
          assert p['symbol']=='TCS', p
          assert int(p['qty'])==32, p
          assert float(p['entry'])==3840.0, p
          assert round(float(data['gross_exposure']),2)==122880.0, data
          PY