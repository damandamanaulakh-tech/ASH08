name: Clean Chitty assembly artifacts

on:
  push:
    branches: [feature/chitty-net-new-adopted]
    paths: [.github/workflows/cleanup-chitty-artifacts.yml]

permissions:
  contents: write

jobs:
  clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove generated bytecode and temporary workflow
        run: |
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          rm .github/workflows/cleanup-chitty-artifacts.yml
      - name: Commit cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Remove generated Python bytecode artifacts'
          git push
