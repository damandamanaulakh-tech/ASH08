services:
  - type: web
    name: ash08-desk
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python api.py
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: ASH08_PARAMETER_SET_ID
        value: "ash08-50l-v1"
      - key: ASH08_BOOK_VALUE
        value: "5000000"
      - key: ASH08_MAX_OPEN_POSITIONS
        value: "10"
      - key: ASH08_MAX_NAME_PCT
        value: "2.5"
      - key: ASH08_MAX_GROSS_PCT
        value: "100"
      - key: ASH08_STOP_PCT
        value: "3"
      - key: ASH08_TARGET_PCT
        value: "6"
      - key: ASH08_MAX_HOLD_SESSIONS
        value: "15"
      - key: ASH08_BUY_COST_PCT
        value: "0.10"
      - key: ASH08_SELL_COST_PCT
        value: "0.10"
      - key: ASH08_SCORE_SELECT
        value: "67"
      - key: ASH08_SCORE_WATCH
        value: "60"
      - key: ASH08_MIN_CONFIDENCE
        value: "1.0"
      - key: ASH08_ALLOW_DEMO
        value: "false"
